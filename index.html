<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="Form-container">
    <div class="Form-picture"></div>
    <div class="Form-section">
        <div class="Form-text">Get Umrah Quote
        <span>All-Inclusive Umrah Package</span>
        </div>
        <form>
            <div class="Form-text-1 ">Lead Passenger Name:</div>
            
            <div class="Form-text-2">
                <input type="text" placeholder="Name">
            </div>

            <div class="Form-text-1">Enter Active Number:</div>
            <div class="Form-text-2">
                  <input type="text" placeholder="+(976)88118679" >
            </div>

            <div class="Form-text-1">Enter Email:</div>
            <div class="Form-text-2">
                <input type="email" placeholder="myemail@gmail.com">
            </div>
            
            <div class="Form-text-1">Total Passenger:</div>
            <div class="Form-text-2">
                <input type="text" placeholder="i.e adults& 2 kid">
            
            </div>
            
            <div class="Bottom">
                <div class="Form-text-3">I accept the 
                <span>Privacy Policy</span></div>
                 <div class="checkbox">
                    <input type="checkbox" name="agree" value="yes">
                 </div>

            </div>
            
            

             
        
            <button type="submit">Submit</button>
            
        </form>
    </div>

    
  </div>
    
</body>
</html>
